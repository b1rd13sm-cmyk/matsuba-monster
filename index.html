const baseQuestions=[
['酸素を確かめる方法は？',['火のついた線香を入れる','石灰水に通す','赤色リトマス紙を入れる','冷やす'],0,'酸素にはものが燃えるのを助ける性質がある。'],
['二酸化炭素で石灰水はどうなる？',['白くにごる','青くなる','赤くなる','変化しない'],0,'二酸化炭素を通すと、石灰水は白くにごる。'],
['水素の性質として正しいものは？',['空気より軽く、燃える','空気より重く、燃えない','石灰水を白くする','金属を必ず溶かす'],0,'水素は空気より軽く、火を近づけると燃える。'],

['質量20g、体積5cm³の物質の密度は？',['4g/cm³','0.25g/cm³','100g/cm³','15g/cm³'],0,'20÷5＝4g/cm³。'],
['水80gに食塩20g。質量パーセント濃度は？',['20％','25％','80％','40％'],0,'20÷(80＋20)×100＝20％。'],
['水100gに砂糖25g。質量パーセント濃度は？',['20％','25％','5％','125％'],0,'25÷125×100＝20％。溶液全体の質量で割る。'],
['液体が気体になる変化は？',['気化','凝固','融解','凝結'],0,'蒸発や沸騰によって液体が気体になる変化を気化という。'],
['氷が水になる変化は？',['融解','凝固','気化','凝結'],0,'固体が液体になる変化を融解という。'],
['純粋な水が沸騰している間、温度は？（1気圧）',['約100℃で一定','上がり続ける','下がり続ける','必ず0℃になる'],0,'純粋な物質では、沸騰中の温度は一定になる。'],
['水溶液の溶けている物質は？',['溶質','溶媒','溶液','沈殿'],0,'溶けている物質を溶質、溶かす液体を溶媒という。'],
['溶解度が温度で大きく変わる物質を取り出す方法は？',['再結晶','ろ過だけ','磁石で集める','かき混ぜるだけ'],0,'水溶液を冷やすなどして結晶を取り出す方法を再結晶という。'],
['アンモニアの性質は？',['水に非常によく溶ける','無臭である','空気より重い','石灰水を白くする'],0,'アンモニアは刺激臭があり、水に非常によく溶け、空気より軽い。'],

const KEY='matsuba-monster-v1';let save={monsters:[],team:[],wins:0,correct:0,total:0,seen:[],questions:null};try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{};let page='adventure',battle=null,quiz=null,quizInterval=null,logs=[],online=null,peer=null,channel=null,roomState=null,questionCursor=0,questionDeck=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{toast('保存できません。設定からセーブを書き出してください。')}}function toast(t){let old=$('.toast');if(old)old.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),4000)}
function makeMon(id,level=1){return {uid:globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random(),id,level,xp:0}}
function maxHp(m){return 66+m.level*8}function attackPower(m,move){return getMove(m,move).power+m.level*2}function hitChance(seconds){return Math.round(Math.max(60,100-Math.max(0,seconds-4)*2.5))}
function go(p){if(quiz)return;if(battle&&!battle.done&&p!=='battle'){toast('バトル中です。「にげる」で探索に戻れます。');return}page=p;render()}
function render(){let tabs=[['adventure','探索'],['collection','仲間'],['dex','図鑑'],['online','通信対戦'],['settings','設定']];$('#nav').innerHTML=tabs.map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('');if(page==='battle'){drawBattle();return}let html='';
if(page==='adventure')html=`<div class="intro"><div><div class="eyebrow">FIELD NOTE / 01</div><h1>知識が、<br>仲間の力になる。</h1><p class="muted">不思議な生き物たちと、理科の世界を探検しよう。<br>技を選ぶ → クイズに答える → 攻撃！</p><div class="row"><span class="tag">ターン制バトル</span><span class="tag">端末に自動保存</span></div><div class="stats"><div><strong>${save.monsters.length}</strong><span>仲間の数</span></div><div><strong>${save.wins}</strong><span>勝利数</span></div><div><strong>${save.total?Math.round(save.correct/save.total*100):0}%</strong><span>クイズ正解率</span></div></div></div><div class="hero-art">${art(save.monsters[0]?.id??0)}${art(2)}<span style="position:absolute;bottom:12px;font-size:11px;color:#64806b">MATSUBA RESEARCH ISLAND</span></div></div>${!save.monsters.length?`<h2>最初のパートナーを選ぼう</h2><div class="grid">${[0,1,2].map(id=>`<div class="card monster-card">${art(id)}<span class="tag">${species[id].type}</span><h2>${species[id].name}</h2><p class="muted">${species[id].desc}</p><button class="primary" onclick="starter(${id})">この仲間で始める</button></div>`).join('')}</div>`:`<div class="row between"><h2>どこを探検する？</h2><span class="muted">探索のたびに仲間のHPが回復します</span></div><div class="grid">${[['◇','結晶の丘','地面の生き物',[0,5]],['≈','水辺の森','水・草の生き物',[1,2]],['✦','光の高原','電気・風・炎',[3,4,6,7]]].map((r,i)=>`<div class="card region"><div class="land">${r[0]}</div><h2>${r[1]}</h2><p class="muted">${r[2]}</p><button class="primary" onclick="explore(${i})">探検する →</button></div>`).join('')}</div>`}<div class="notice">正解したときの命中率：4秒以内 100％ / 12秒 80％ / 20秒以降 60％。不正解・30秒の時間切れはミス。技の威力は回答速度で変わりません。</div><p class="offline-note">オリジナルの生き物・名称・図形で制作した理科学習ゲーム。オフラインで遊ぶには「設定 → オフライン版を保存」。</p>`;

if(page==='online')html=onlineHTML();if(page==='settings')html=`<div class="eyebrow">CLASSROOM SETTINGS</div><h1>授業とセーブの設定</h1><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>オフラインで遊ぶ</h2><p class="muted">ゲーム本体を1つのHTMLファイルで保存。PCやChromebookのブラウザーで開くと、ネットなしでも捕獲・バトルができます。iPadはHTMLをSafariで開く方法が端末によって異なります。</p><button class="primary" onclick="downloadGame()">オフライン版を保存</button><h2 style="margin-top:24px">進行状況を引き継ぐ</h2><p class="muted">セーブはブラウザーごとに保存されます。端末の変更やデータ消去に備えて書き出せます。</p><div class="row"><button onclick="exportSave()">セーブを書き出す</button><button onclick="$('#savefile').click()">セーブを読み込む</button></div><input hidden id="savefile" type="file" accept="application/json,.json" onchange="importSave(this.files[0])"></div><div class="card"><h2>授業の問題を入れる</h2><p class="muted">1行につき「問題[TAB]正解[TAB]誤答1[TAB]誤答2[TAB]誤答3」。Excelやスプレッドシートの5列をそのまま貼り付けられます。空行は無視します。</p><textarea id="questionInput" placeholder="問題&#9;正解&#9;誤答1&#9;誤答2&#9;誤答3"></textarea><div class="row"><button class="primary" onclick="importQuestions()">問題を置き換える</button><button onclick="resetQuestions()">標準問題に戻す</button></div><p class="muted">現在：${(save.questions||baseQuestions).length}問 / 標準は中1理科20問</p></div></div>`;$('#app').innerHTML=html;

function starter(id){let m=makeMon(id);save.monsters.push(m);save.team=[m.uid];persist();render();toast(species[id].name+'が仲間になった！')}
function toggleTeam(uid){if(save.team.includes(uid)){if(save.team.length===1){toast('パーティには1体以上必要です');return}save.team=save.team.filter(x=>x!==uid)}else{if(save.team.length>=3){toast('パーティは3体までです');return}save.team.push(uid)}persist();render()}
function teamCopies(){return save.team.map(uid=>save.monsters.find(m=>m.uid===uid)).filter(Boolean).map(m=>({...m,hp:maxHp(m)}))}
function explore(region){if(!save.team.length)return;let pools=[[0,5],[1,2],[3,4,6,7]],id=pools[region][Math.floor(Math.random()*pools[region].length)],team=teamCopies(),lv=Math.max(1,Math.min(50,team[0].level+Math.floor(Math.random()*3)-1)),enemy=makeMon(id,lv);enemy.hp=maxHp(enemy);battle={teams:[team,[enemy]],active:[0,0],turn:0,done:false,mode:'wild',captures:0};logs=[];log('野生の'+species[id].name+'があらわれた！');if(!save.seen.includes(id)){save.seen.push(id);persist()}page='battle';render()}
function unit(side){return battle.teams[side][battle.active[side]]}function localSide(){return battle.mode==='online'?(online?.host?0:1):0}function myTurn(){return !battle.done&&battle.turn===localSide()}
function log(s){logs.unshift(s);logs=logs.slice(0,35)}function status(m,foe){return `<div class="status ${foe?'foe':''}"><div class="row between"><strong>${species[m.id].name}</strong><span>Lv.${m.level}</span></div><div class="hp"><i style="width:${Math.max(0,m.hp)/maxHp(m)*100}%;background:${m.hp/maxHp(m)<.3?'#df9a59':'#5a9d65'}"></i></div><div class="row between" style="font-size:11px;margin-top:5px">${typeBadge(monsterType(m))}<span>${Math.max(0,m.hp)} / ${maxHp(m)}</span></div></div>`}
function drawBattle(){if(!battle){page='adventure';render();return}let side=localSide(),me=unit(side),foe=unit(1-side);$('#app').innerHTML=`<div class="row between" style="margin-bottom:14px"><div><span class="eyebrow">${battle.mode==='wild'?'WILD ENCOUNTER':'ONLINE DUEL'}</span><h2 style="margin:3px 0">${battle.mode==='wild'?'野生のモンスターとのバトル':'通信対戦'}</h2></div><span class="tag">${battle.done?'バトル終了':myTurn()?'あなたのターン':'相手のターン'}</span></div><div class="battle-layout"><div><div class="arena">${status(me,false)}${status(foe,true)}<div class="platform"></div><div class="platform foe"></div><div class="sprite" id="mySprite">${art(me.id)}</div><div class="sprite foe" id="foeSprite">${art(foe.id)}</div></div>${battle.done?`<div class="result"><h2>${esc(battle.result)}</h2><p>${esc(battle.reward||'')}</p><button class="primary" onclick="leaveBattle()">${battle.mode==='online'?'通信画面へ':'探索に戻る'}</button></div>`:`<div class="notice" aria-live="polite">${esc(logs[0]||'技を選ぼう')}</div><div class="commands">${movesFor(me).map((move,i)=>`<button ${!myTurn()?'disabled':''} class="move-command" style="--move-color:${TYPE_SYSTEM[move.type].color};--move-bg:${TYPE_SYSTEM[move.type].bg}" onclick="chooseMove(${i})"><span>${esc(move.name)}</span> ${typeBadge(move.type)} <span class="type-mult ${moveMultiplier(me,i,foe)===2?'effect-strong':moveMultiplier(me,i,foe)===.5?'effect-resist':'effect-neutral'}">×${moveMultiplier(me,i,foe)}</span><small>基本威力 ${attackPower(me,i)} → 相性適用 ${battleDamage(me,i,foe)} ・ ${(['基本技','高威力（技命中補正 −15％）','安定技（技命中補正 ＋10％）'][i]??'追加技')}</small></button>`).join('')}<button ${!myTurn()?'disabled':''} onclick="switchMenu()">仲間と交代<small>交代すると相手のターンへ</small></button>${battle.mode==='wild'?`<button ${!myTurn()?'disabled':''} onclick="capture()">◇ 共鳴プリズムで捕獲<small>HPを減らすと成功率アップ・所持 ${save.bag?.prism??5}個</small></button><button ${!myTurn()?'disabled':''} onclick="flee()">にげる<small>探索に戻る</small></button>`:`<button onclick="concede()">降参する<small>この対戦を終了</small></button>`}</div>`}</div><aside class="card side-log"><h2>バトルログ</h2><div class="log">${logs.map(l=>`<p>${esc(l)}</p>`).join('')}</div><div style="margin-top:20px"><span class="eyebrow">YOUR PARTY</span>${battle.teams[side].map((m,i)=>`<p class="muted">${i===battle.active[side]?'▶':'・'} ${species[m.id].name}　${m.hp>0?m.hp+' HP':'戦闘不能'}</p>`).join('')}</div></aside></div>`}
function chooseMove(move){if(!myTurn()||quiz)return;startQuiz({kind:'attack',move})}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQuestion(){let qs=save.questions||baseQuestions;if(!questionDeck.length)questionDeck=shuffle(qs.map((_,i)=>i));return qs[questionDeck.pop()]}
function startQuiz(action){let q=nextQuestion(),answers=shuffle(q[1].map((t,i)=>({t,correct:i===q[2]})));quiz={q,answers,action,start:performance.now(),finished:false};$('#overlay').innerHTML=`<div class="quiz-back"><section class="quiz" role="dialog" aria-modal="true" aria-label="理科クイズ"><div class="row between"><span class="eyebrow">SCIENCE CHALLENGE</span><span class="tag">${action.kind==='capture'?'捕獲チャレンジ':'技の発動チャレンジ'}</span></div><div class="row between"><span><span class="time-number" id="seconds">0.0</span> 秒</span><strong id="chance">正解時の命中率 100％</strong></div><div class="timer"><i id="timerBar" style="width:100%"></i></div><h2>${esc(q[0])}</h2><div class="answers">${answers.map((a,i)=>`<button onclick="answer(${i})">${esc(a.t)}</button>`).join('')}</div><p class="muted" style="margin-top:18px">不正解はミス。30秒で時間切れ。速く正解するほど命中率が高くなります。</p></section></div>`;quizInterval=setInterval(()=>{if(!quiz||quiz.finished)return;let s=(performance.now()-quiz.start)/1000;$('#seconds').textContent=s.toFixed(1);$('#chance').textContent='正解時の命中率 '+hitChance(s)+'％';$('#timerBar').style.width=Math.max(0,100-s/30*100)+'%';if(s>=30)answer(-1)},100);$('.answers button').focus()}
function answer(index){if(!quiz||quiz.finished)return;quiz.finished=true;clearInterval(quizInterval);let s=(performance.now()-quiz.start)/1000,ok=index>=0&&s<30&&quiz.answers[index]?.correct,action={...quiz.action,correct:!!ok,seconds:Math.min(30,s)};save.total++;if(ok)save.correct++;persist();let q=quiz.q;$('#overlay').innerHTML=`<div class="quiz-back"><div class="quiz"><span class="tag">${ok?'正解！':index<0?'時間切れ':'不正解'}</span><h2 style="margin-top:16px">${esc(q[1][q[2]])}</h2><p>${esc(q[3]||'正解を確認して、次に生かそう。')}</p><p class="muted">${ok?'回答時間 '+s.toFixed(1)+'秒 ・ 基本命中率 '+hitChance(s)+'％':'このターンの行動はミスになります。'}</p><button class="primary" id="resolveBtn">バトルに戻る →</button></div></div>`;$('#resolveBtn').onclick=()=>{quiz=null;$('#overlay').innerHTML='';perform(action)}}
function perform(action){if(battle.mode==='online'){if(!channel||channel.readyState!=='open'){toast('通信が切れています');return}if(online.host)resolveAction(0,action);else{channel.send(JSON.stringify({type:'action',action}));battle.turn=0;drawBattle()}}else resolveAction(0,action)}
function resolveAction(side,action){if(battle.done||battle.turn!==side)return;let me=unit(side),foe=unit(1-side),name=species[me.id].name;if(action.kind==='attack'){if(!Number.isInteger(action.move)||action.move<0||!getMove(me,action.move))return;let move=getMove(me,action.move),chance=Math.min(100,hitChance(Number.isFinite(action.seconds)?Math.max(0,action.seconds):30)+([0,-15,10][action.move]??0));if(action.correct&&Math.random()*100<chance){let dmg=battleDamage(me,action.move,foe);recordAttack(side,me,action.move,foe,true,dmg);foe.hp=Math.max(0,foe.hp-dmg);log(name+'の'+move.name+'！ '+dmg+'ダメージ（命中率 '+chance+'％）'+typeLog(me,action.move,foe))}else {recordAttack(side,me,action.move,foe,false,0);log(name+'の'+move.name+'はミス！'+(action.correct?'（命中率 '+chance+'％）':'（クイズ不正解）'))}}
if(action.kind==='capture'&&battle.mode==='wild'){battle.captures++;let chance=Math.round((20+(1-foe.hp/maxHp(foe))*65)*(action.correct?hitChance(action.seconds)/100:0));if(action.correct&&Math.random()*100<chance){let m=makeMon(foe.id,foe.level);save.monsters.push(m);if(save.team.length<3)save.team.push(m.uid);persist();finish(0,species[m.id].name+'が仲間になった！','仲間のページでパーティを編成できます。');return}else log('共鳴が届かなかった…（捕獲率 '+chance+'％）')}
if(action.kind==='switch'){let idx=action.index;if(!Number.isInteger(idx)||idx===battle.active[side]||!battle.teams[side][idx]||battle.teams[side][idx].hp<=0)return;battle.active[side]=idx;log(species[unit(side).id].name+'に交代した！')}
if(foe.hp<=0){let next=battle.teams[1-side].findIndex(m=>m.hp>0);if(next<0){finish(side);return}battle.active[1-side]=next;log(species[unit(1-side).id].name+'が繰り出された！')}
battle.turn=1-side;if(battle.mode==='wild'){drawBattle();setTimeout(enemyTurn,1000)}else{syncBattle();drawBattle()}}
function enemyTurn(){if(!battle||battle.done||battle.mode!=='wild'||battle.turn!==1)return;let m=unit(1),f=unit(0),i=Math.floor(Math.random()*movesFor(m).length);if(Math.random()<.88){let dmg=battleDamage(m,i,f);recordAttack(1,m,i,f,true,dmg);f.hp=Math.max(0,f.hp-dmg);log(species[m.id].name+'の'+getMove(m,i).name+'！ '+dmg+'ダメージ'+typeLog(m,i,f))}else {recordAttack(1,m,i,f,false,0);log(species[m.id].name+'の技はミス！');}if(f.hp<=0){let next=battle.teams[0].findIndex(m=>m.hp>0);if(next<0){finish(1);return}battle.active[0]=next;log(species[unit(0).id].name+'、お願い！')}battle.turn=0;drawBattle()}
function finish(winner,result,reward){battle.done=true;battle.winner=winner;battle.result=result||((winner===localSide())?'バトルに勝った！':'バトルに負けた…');battle.reward=reward||'';if(battle.mode==='wild'&&winner===0&&!result){save.wins++;let leveled=[];battle.teams[0].forEach(m=>{let original=save.monsters.find(x=>x.uid===m.uid);if(original){original.xp+=20;while(original.xp>=original.level*25&&original.level<50){original.xp-=original.level*25;original.level++;leveled.push(species[original.id].name+' Lv.'+original.level)}}});battle.reward='パーティ全員が20 EXPを獲得。'+leveled.join(' / ');persist()}if(battle.mode==='online'){syncBattle()}drawBattle()}
function capture(){if(!myTurn())return;if(battle.captures>=3){toast('このバトルのプリズムは使い切りました');return}startQuiz({kind:'capture'})}function flee(){if(!myTurn())return;battle=null;page='adventure';render()}function leaveBattle(){let net=battle.mode==='online';battle=null;page=net?'online':'adventure';render()}function switchMenu(){if(!myTurn())return;let side=localSide(),choices=battle.teams[side].map((m,i)=>({m,i})).filter(x=>x.i!==battle.active[side]&&x.m.hp>0);if(!choices.length){toast('交代できる仲間がいません');return}$('#overlay').innerHTML=`<div class="quiz-back"><div class="quiz"><h2>交代する仲間を選ぶ</h2>${choices.map(({m,i})=>`<button style="margin:5px" onclick="doSwitch(${i})">${species[m.id].name} / HP ${m.hp}</button>`).join('')}<p><button onclick="$('#overlay').innerHTML=''">戻る</button></p></div></div>`}function doSwitch(index){$('#overlay').innerHTML='';perform({kind:'switch',index})}
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function downloadGame(){try{let text=await fetch(location.href).then(r=>{if(!r.ok)throw Error();return r.text()});if(!text.startsWith('<!doctype html>'))throw Error();download('matsuba-monster.html',text,'text/html');toast('ゲーム本体を保存しました。進行状況は別途セーブを書き出してください。')}catch{toast('この画面から保存できません。オンライン版で保存してください。')}}function exportSave(){download('matsuba-monster-save.json',JSON.stringify(save,null,2),'application/json')}
function validMon(m){return m&&typeof m.uid==='string'&&Number.isInteger(m.id)&&m.id>=0&&m.id<species.length&&Number.isInteger(m.level)&&m.level>=1&&m.level<=50&&Number.isFinite(m.xp)&&m.xp>=0&&(!m.type||Object.hasOwn(TYPE_SYSTEM,m.type))&&(!m.learnedMoves||(Array.isArray(m.learnedMoves)&&m.learnedMoves.length>0&&m.learnedMoves.length<=12&&m.learnedMoves.every(v=>v&&typeof v.name==='string'&&Number.isFinite(v.power)&&v.power>=0&&Object.hasOwn(TYPE_SYSTEM,v.type))))}
async function importSave(file){if(!file)return;try{let s=JSON.parse(await file.text());if(!Array.isArray(s.monsters)||!s.monsters.every(validMon)||!Array.isArray(s.team)||s.team.length>3||!s.team.every(u=>s.monsters.some(m=>m.uid===u))||new Set(s.team).size!==s.team.length||new Set(s.monsters.map(m=>m.uid)).size!==s.monsters.length||s.monsters.length&&!s.team.length)throw Error();if(s.questions&&(!Array.isArray(s.questions)||!s.questions.length||!s.questions.every(q=>Array.isArray(q)&&typeof q[0]==='string'&&Array.isArray(q[1])&&q[1].length===4&&q[1].every(a=>typeof a==='string')&&Number.isInteger(q[2])&&q[2]>=0&&q[2]<=3)))throw Error();save={monsters:s.monsters,team:s.team,wins:Number(s.wins)||0,correct:Number(s.correct)||0,total:Number(s.total)||0,seen:Array.isArray(s.seen)?s.seen:[],questions:s.questions||null};questionDeck=[];persist();render();toast('セーブを読み込みました')}catch{toast('セーブファイルの形式を確認してください')}}
function importQuestions(){let lines=$('#questionInput').value.split(/\r?\n/).filter(l=>l.trim()),qs=[];for(let [i,l] of lines.entries()){let parts=l.split('\t').map(s=>s.trim());if(parts.length!==5||parts.some(x=>!x)){toast((i+1)+'行目：空欄のない5列で貼り付けてください');return}qs.push([parts[0],parts.slice(1),0,'正解：'+parts[1]])}if(!qs.length){toast('問題を貼り付けてください');return}save.questions=qs;questionDeck=[];persist();render();toast(qs.length+'問を登録しました')}function resetQuestions(){save.questions=null;questionDeck=[];persist();render();toast('中1理科の標準20問に戻しました')}
function onlineHTML(){return `<div class="eyebrow">PEER TO PEER BATTLE</div><h1>仲間と、通信対戦。</h1><p class="muted">2人の端末を直接つなぐ対戦モード。インターネット接続が必要です。コードを相手に渡して接続します。専用アカウントは不要。</p><div class="notice">両方の端末で仲間を選び、同じ問題を設定してから接続。学校のネットワークなどでは直接接続できない場合があります。コードの交換は2回です。対戦は先攻・後攻をランダムに決めます。</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h2>① 対戦を作る側</h2><p class="muted">招待コードを作って相手に渡す → 相手から返ってきた返信コードを下の欄に貼り付けて接続。</p><button class="primary" onclick="createOffer()" ${!save.team.length?'disabled':''}>招待コードを作る</button><label>相手からの返信コード</label><textarea id="answerCode" placeholder="返信コードを貼り付ける"></textarea><button onclick="acceptAnswer()">返信コードで接続</button></div><div class="card"><h2>② 対戦に参加する側</h2><p class="muted">相手の招待コードを貼り付けて返信コードを作る → 返信コードを相手に渡す。</p><label>相手からの招待コード</label><textarea id="offerCode" placeholder="招待コードを貼り付ける"></textarea><button class="primary" onclick="createAnswer()" ${!save.team.length?'disabled':''}>返信コードを作る</button></div></div><div class="card" style="margin-top:18px"><div class="row between"><h2 id="connectionStatus">${channel?.readyState==='open'?'接続済み':online?.status||'接続待ち'}</h2><button onclick="disconnect()">接続を解除</button></div><label>相手に渡すコード</label><textarea id="outCode" readonly>${esc(online?.code||'')}</textarea><div class="row"><button onclick="copyCode()">コードをコピー</button><button class="primary" onclick="startOnline()" ${channel?.readyState==='open'&&online?.host&&online?.remoteTeam?'':'disabled'}>対戦を始める（作成側）</button></div><p class="muted">接続にはWebRTCを使用。中継サーバーは用意していないため、直接接続が許可されない環境では対戦できません。通信対戦では捕獲・経験値の獲得はありません。</p></div>`}
function encodeDescription(d){return btoa(JSON.stringify(d))}function decodeDescription(s){let d=JSON.parse(atob(s.trim()));if(!['offer','answer'].includes(d.type)||typeof d.sdp!=='string')throw Error();return d}
function netStatus(t){if(online)online.status=t;if(page==='online')render();else toast(t)}
function setupPeer(host){if(peer)peer.close();online={host,status:'接続コードを準備中…',code:'',remoteTeam:null};peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]});peer.onconnectionstatechange=()=>{if(['failed','disconnected','closed'].includes(peer.connectionState)){netStatus('通信が切れました。再接続してください。');if(battle?.mode==='online'&&!battle.done){battle.done=true;battle.result='通信が切れました';drawBattle()}}};if(host)setupChannel(peer.createDataChannel('matsuba'));else peer.ondatachannel=e=>setupChannel(e.channel)}
function setupChannel(ch){channel=ch;ch.onopen=()=>{online.status='接続済み';ch.send(JSON.stringify({type:'team',rules:TYPE_RULE_VERSION,team:teamCopies()}));netStatus('接続済み。作成側が対戦を開始できます。')};ch.onclose=()=>{netStatus('接続が終了しました');if(battle?.mode==='online'&&!battle.done){battle.done=true;battle.result='通信が終了しました';drawBattle()}};ch.onmessage=e=>{try{let msg=JSON.parse(e.data);if(['team','state'].includes(msg.type)&&msg.rules!==TYPE_RULE_VERSION){online.remoteTeam=null;online.rulesMatch=false;netStatus('相性ルールが一致しません。両方で最新版を開き直して接続してください。');return}if(msg.type==='team'&&Array.isArray(msg.team)&&msg.team.length>=1&&msg.team.length<=3&&msg.team.every(validMon)){online.rulesMatch=true;online.remoteTeam=msg.team.map(m=>({...m,hp:maxHp(m)}));if(page==='online')render()}if(msg.type==='state'&&!online.host&&msg.battle?.mode==='online'&&Array.isArray(msg.battle.teams)&&msg.battle.teams.length===2&&msg.battle.teams.every(t=>Array.isArray(t)&&t.length&&t.length<=3&&t.every(validMon))){battle=msg.battle;logs=msg.logs||[];if(battle.done)battle.result=battle.winner===1?'バトルに勝った！':'バトルに負けた…';page='battle';render()}if(msg.type==='action'&&online.host&&battle?.mode==='online')resolveAction(1,msg.action||{});if(msg.type==='concede'&&online.host&&battle?.mode==='online'&&!battle.done)finish(0)}catch{toast('通信データを読み取れませんでした')}}}
function waitIce(){return new Promise((res,rej)=>{let timer=setTimeout(()=>{peer.removeEventListener('icegatheringstatechange',check);rej(Error('コードの準備が時間切れになりました'))},15000);function check(){if(peer.iceGatheringState==='complete'){clearTimeout(timer);peer.removeEventListener('icegatheringstatechange',check);res()}}peer.addEventListener('icegatheringstatechange',check);check()})}
async function createOffer(){try{if(!save.team.length)return;setupPeer(true);await peer.setLocalDescription(await peer.createOffer());await waitIce();online.code=encodeDescription(peer.localDescription);netStatus('招待コードを相手に渡してください')}catch(e){netStatus('コードを作れませんでした。ブラウザーと通信環境を確認してください')}}
async function createAnswer(){try{let d=decodeDescription($('#offerCode').value);if(d.type!=='offer')throw Error();setupPeer(false);await peer.setRemoteDescription(d);await peer.setLocalDescription(await peer.createAnswer());await waitIce();online.code=encodeDescription(peer.localDescription);netStatus('返信コードを相手に渡してください')}catch(e){toast('招待コードまたは通信環境を確認してください')}}
async function acceptAnswer(){try{if(!peer||!online.host){toast('先に招待コードを作ってください');return}let d=decodeDescription($('#answerCode').value);if(d.type!=='answer')throw Error();await peer.setRemoteDescription(d);netStatus('接続中…')}catch{toast('返信コードを確認してください')}}

function startOnline(){if(!online?.host||!online.remoteTeam||online.rulesMatch===false||channel?.readyState!=='open')return;battle={mode:'online',teams:[teamCopies(),online.remoteTeam.map(m=>({...m,hp:maxHp(m)}))],active:[0,0],turn:Math.random()<.5?0:1,done:false};logs=[];log('対戦開始！ '+(battle.turn===0?'作成側':'参加側')+'が先攻。');page='battle';syncBattle();render()}
function syncBattle(){if(battle?.mode==='online'&&online?.host&&channel?.readyState==='open')channel.send(JSON.stringify({type:'state',rules:TYPE_RULE_VERSION,battle,logs}))}
function concede(){if(!battle||battle.done)return;if(online.host)finish(1);else{if(channel?.readyState==='open')channel.send(JSON.stringify({type:'concede'}));battle.done=true;battle.result='降参しました';drawBattle()}}
function disconnect(){if(peer)peer.close();peer=null;channel=null;online=null;if(battle?.mode==='online')battle=null;render()}

const sixStyle=document.createElement('style');sixStyle.textContent=`.type-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:var(--type-bg);color:var(--type-color);font-size:12px;font-weight:800;white-space:nowrap}.effect-strong{background:#fff0e4;color:#a1462f}.effect-resist{background:#e7eef7;color:#466586}.effect-neutral{background:#eff1ea;color:#61756b}.type-mult{border-radius:6px;padding:3px 7px;font-weight:800;white-space:nowrap}.commands .move-command{border-left:5px solid var(--move-color);background:linear-gradient(110deg,var(--move-bg),white 75%)}.commands .move-command small{margin-top:6px;line-height:1.6}.dex-details{max-height:85vh;overflow:auto}.dex-details svg{display:block;width:145px;height:145px;margin:auto}.dex-details .item-row{margin:8px 0}.type-matrix{width:100%;min-width:460px;border-collapse:collapse;text-align:center;font-size:12px}.type-matrix td,.type-matrix th{padding:8px 5px;border:1px solid #e1e6da}.type-cycle{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:13px;background:#edf2e6;border-radius:12px}.attack-fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}.attack-fx svg{position:absolute;inset:0;width:100%;height:100%}.attack-fx .fx-impact{transform-origin:var(--impact-x) 50%;animation:fx-impact .85s ease-out both}.attack-fx .fx-beam{stroke-dasharray:500;stroke-dashoffset:500;animation:fx-beam .75s ease-out both}.attack-fx.super{background:radial-gradient(circle at var(--impact-x) 50%,var(--fx-glow),transparent 65%);animation:fx-screen .9s ease-out both}.arena.weak-hit{animation:weak-shake .48s ease-in-out}.fx-message{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#173a38e8;color:white;font-size:clamp(15px,3vw,23px);font-weight:900;border-radius:12px;padding:10px 17px;white-space:nowrap;animation:fx-screen 1.1s ease-out both}.fx-message.super-message{background:#b85033ef}.sprite.damage-hit{animation:hit .3s 2}@keyframes fx-beam{35%,70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-500;opacity:0}}@keyframes fx-impact{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(1.55)}}@keyframes fx-screen{0%{opacity:0}15%,70%{opacity:1}100%{opacity:0}}@keyframes weak-shake{15%,55%{transform:translateX(-5px)}35%,75%{transform:translateX(5px)}100%{transform:translateX(0)}}@media(max-width:760px){.commands .move-command{padding:11px}.commands .move-command small{font-size:11px}.type-badge{font-size:11px}.dex-details{max-height:83vh}.type-matrix{font-size:11px}.type-cycle{font-size:12px}}@media(prefers-reduced-motion:reduce){.attack-fx .fx-impact,.attack-fx .fx-beam{animation:none;opacity:.7;stroke-dashoffset:0}.arena.weak-hit{animation:none}}`;
document.head.append(sixStyle);
function showAttackEffect(event){if(!event||event.id===lastFX)return;lastFX=event.id;let arena=$('.arena');if(!arena)return;let side=localSide(),attackerHere=event.side===side,target=attackerHere?$('#foeSprite'):$('#mySprite'),x=attackerHere?76:22,y=attackerHere?33:67,from=attackerHere?'22 67':'76 33',type=TYPE_SYSTEM[event.type];if(!type)return;let e=document.createElement('div');e.className='attack-fx'+(event.hit&&event.mult===2?' super':'');e.style.setProperty('--impact-x',x+'%');e.style.setProperty('--fx-glow',type.color+'66');let symbols={flame:`<path d="M${x-9} ${y+7}q-7-8 4-17-1 8 5 5 6-9 3-14 17 15 9 26Z" fill="${type.color}"/><path d="M${x-3} ${y+6}q-2-7 4-11 7 9 2 11" fill="#ffda8b"/>`,water:`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="${type.color}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="17" fill="none" stroke="${type.color}" stroke-width="1.5"/><path d="M${x} ${y-15}q-11 12 0 15 11-3 0-15" fill="${type.color}"/>`,leaf:`<path d="M${x-15} ${y-9}q19-7 16 8-17 8-16-8M${x+3} ${y+12}q-2-21 15-14 3 20-15 14" fill="${type.color}"/><path d="M${x-18} ${y+14}q10-15 18-8-7 14-18 8" fill="${type.color}"/>`,electric:`<path d="M${x+6} ${y-22} ${x-12} ${y+1} ${x} ${y+1} ${x-7} ${y+22} ${x+15} ${y-5} ${x+3} ${y-5}Z" fill="${type.color}" stroke="#ffe998" stroke-width="1"/>`,earth:`<path d="M${x-18} ${y+13}l2-14 10-4 9 8-5 12ZM${x+1} ${y-13}l5-8 12 5-2 11-9 1Z" fill="${type.color}"/><path d="M${x-20} ${y+17}l9-6 9 4 8-9 13 8" fill="none" stroke="${type.color}" stroke-width="2"/>`,wind:`<path d="M${x-18} ${y-10}q35-10 31 2-2 7-10 3M${x-20} ${y}q43-8 37 6-3 5-9 2M${x-15} ${y+12}q20-4 25-1" stroke="${type.color}" fill="none" stroke-width="3" stroke-linecap="round"/>`};let effect=event.hit?symbols[type.effect]:'';e.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="fx-beam" d="M${from} Q50 15 ${x} ${y}" stroke="${type.color}" fill="none" stroke-width="${event.mult===2&&event.hit?3:1.5}"/><g class="fx-impact" style="transform-origin:${x}px ${y}px">${effect}</g></svg><div class="fx-message ${event.hit&&event.mult===2?'super-message':''}">${event.hit?(typeEffectText(event.mult)||'命中！'):'ミス！'}</div>`;arena.append(e);if(event.hit){target?.classList.add('damage-hit');if(event.mult===2)arena.classList.add('weak-hit')}setTimeout(()=>{e.remove();target?.classList.remove('damage-hit');arena.classList.remove('weak-hit')},1200)}
function showTypeChart(){stopWalking();const ts=Object.keys(TYPE_SYSTEM),cycle=['炎','草','風','地面','電気','水'];$('#overlay').innerHTML=`<div class="quiz-back"><section class="quiz dex-details"><h2>6属性の相性</h2><p class="muted">矢印の先に攻撃すると2倍。逆方向は半減。それ以外と同じ属性同士は1倍。</p><div class="type-cycle">${cycle.map(t=>typeBadge(t)+' →').join('')} ${typeBadge('炎')}</div><div class="shop-grid" style="margin-top:14px">${ts.map(t=>`<div class="item-row"><div class="row between">${typeBadge(t)}<span>→ ${typeBadge(TYPE_SYSTEM[t].weakTarget)} <b class="type-mult effect-strong">×2</b></span><span>→ ${typeBadge(TYPE_SYSTEM[t].resistTarget)} <b class="type-mult effect-resist">×0.5</b></span></div></div>`).join('')}</div><details style="margin:16px 0"><summary style="cursor:pointer;font-weight:700">全36通りの相性表を見る</summary><p class="muted">縦：攻撃技の属性 / 横：相手モンスターの属性。横にスクロールできます。</p><div style="overflow:auto"><table class="type-matrix"><thead><tr><th>攻撃↓ / 相手→</th>${ts.map(t=>`<th>${TYPE_SYSTEM[t].icon}<br>${t}</th>`).join('')}</tr></thead><tbody>${ts.map(a=>`<tr><th>${TYPE_SYSTEM[a].icon} ${a}</th>${ts.map(d=>{let m=typeMultiplier(a,d);return `<td class="${m===2?'effect-strong':m===.5?'effect-resist':''}">×${m}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details><div class="notice">技とモンスターの属性は独立。属性一致ボーナスはありません。命中した時だけ倍率を適用し、小数点以下を四捨五入します。</div><p class="muted">ゲーム用の相性です。実際の物質の性質や化学反応を表すものではありません。</p><button class="primary" onclick="$('#overlay').innerHTML=''">戻る</button></section></div>`}
function showMonsterDetails(id,uid){let m=save.monsters.find(m=>m.uid===uid)||{id,level:1};let type=monsterType(m);$('#overlay').innerHTML=`<div class="quiz-back"><section class="quiz dex-details"><span class="eyebrow">MONSTER FIELD GUIDE</span>${art(m.id)}<h2>${species[m.id].name}${uid?' Lv.'+m.level:''}</h2>${typeBadge(type)}<p class="muted">${esc(species[m.id].desc)}</p><div class="item-row"><strong>弱点（受けるダメージ ×2）</strong><div class="row">${defensiveTypes(type,2).map(typeBadge).join('')}</div></div><div class="item-row"><strong>耐性（受けるダメージ ×0.5）</strong><div class="row">${defensiveTypes(type,.5).map(typeBadge).join('')}</div></div><h2 style="margin-top:20px">使える技</h2>${movesFor(m).map(move=>`<div class="item-row"><div class="row between"><strong>${esc(move.name)}</strong>${typeBadge(move.type)}</div><span class="muted">基本威力 ${move.power}${uid?' / 現在の威力 '+(move.power+m.level*2):''}</span></div>`).join('')}<div class="row"><button class="primary" onclick="$('#overlay').innerHTML=''">戻る</button><button onclick="showTypeChart()">相性表</button></div></section></div>`}
function renderDex(){$('#app').innerHTML=`<span class="eyebrow">MONSTER FIELD GUIDE</span><div class="row between"><h1>モンスター図鑑</h1><button onclick="showTypeChart()">6属性の相性表</button></div><p class="muted">属性、弱点、耐性と、技ごとの属性を確認しよう。</p><div class="grid">${species.map((s,i)=>`<article class="card monster-card">${art(i)}${typeBadge(s.type)}<h2 style="margin-top:10px">${s.name}</h2><p class="muted">仲間 ${save.monsters.filter(m=>m.id===i).length}体</p><div class="row"><span class="muted">弱点</span>${defensiveTypes(s.type,2).map(typeBadge).join('')}</div><div class="row" style="margin-top:7px"><span class="muted">耐性</span>${defensiveTypes(s.type,.5).map(typeBadge).join('')}</div><button style="margin-top:15px" onclick="showMonsterDetails(${i})">詳細と技を見る</button></article>`).join('')}</div>`}
let fxPending=null;const sixDrawBattle=drawBattle;drawBattle=function(){sixDrawBattle();if(!battle?.lastAttack)return;if(typeof requestAnimationFrame==='function'){if(fxPending!==null)cancelAnimationFrame(fxPending);fxPending=requestAnimationFrame(()=>{fxPending=null;if(page==='battle')showAttackEffect(battle?.lastAttack)})}else showAttackEffect(battle.lastAttack)};
const sixRenderWorld=renderWorld;renderWorld=function(){sixRenderWorld();let footer=$('.world-footer');if(footer){let b=document.createElement('button');b.textContent='属性の相性表';b.onclick=showTypeChart;footer.append(b)}};
const sixRender=render;render=function(){sixRender();if(page==='dex')renderDex();if(page==='settings'){let b=document.createElement('button');b.textContent='6属性の相性表を見る';b.onclick=showTypeChart;$('#app').append(b)}if(page==='collection'){let cards=document.querySelectorAll('.monster-card');cards.forEach((card,i)=>{let m=save.monsters[i];if(!m)return;let b=document.createElement('button');b.style.marginTop='10px';b.textContent='詳細・弱点・技';b.onclick=()=>showMonsterDetails(m.id,m.uid);card.append(b)})}};
render();

</script></body></html>
